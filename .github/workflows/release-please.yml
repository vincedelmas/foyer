name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      build_tv: ${{ steps.targets.outputs.build_tv }}
      build_server: ${{ steps.targets.outputs.build_server }}
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - name: Determine release targets
        id: targets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
            
            const releasePr = prs.find(pr => pr.merged_at && pr.base.ref === "main" && pr.head.ref.startsWith("release-please--"));
            const labels = new Set(releasePr?.labels.map(label => label.name) ?? []);

            const tvOnly = labels.has("tv-only");
            const serverOnly = labels.has("server-only");

            if (serverOnly && tvOnly) {
              core.setFailed("Choose either server-only or tv-only, not both.");
              return;
            }

            // No label = build both.
            const buildServer = !tvOnly;
            const buildTv = !serverOnly;

            core.setOutput("build_server", String(buildServer));
            core.setOutput("build_tv", String(buildTv));

            core.info(`Release PR: ${releasePr?.number ?? "none"}`);
            core.info(`Build server: ${buildServer}`);
            core.info(`Build Android TV: ${buildTv}`);

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android-tv:
    name: Publish Android TV APK
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.release_created == 'true' &&
        needs.release-please.outputs.build_tv == 'true'
      }}
    uses: ./.github/workflows/android-tv-apk.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  server-image:
    name: Publish Foyer Docker image
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.release_created == 'true' &&
        needs.release-please.outputs.build_server == 'true'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vincedelmas/foyer:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/vincedelmas/foyer:latest

      # Normally Android workflow publishes GitHub release. For server-only releases, we do it.
      - name: Publish server-only GitHub release
        if: needs.release-please.outputs.build_tv == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
